
services:
  # ======================
  # Edge: Cloudflare Tunnel
  # ======================
  # Outbound-only connection to Cloudflare. No inbound ports are published on
  # the host by any service below — the tunnel reaches them over the compose
  # network by container name. Public hostname -> service routing is configured
  # in the Cloudflare Zero Trust dashboard (or deploy/cloudflared/config.yml if
  # you switch to a locally-managed tunnel). See deploy/cloudflared/README.md.
  cloudflared:
    image: cloudflare/cloudflared:2024.10.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - admin-frontend
      - panel-frontend
      - student-frontend
      - mentor-frontend

  # ======================
  # Backends
  # ======================

  admin-backend:
    build:
      context: ./backend/admin-api
      dockerfile: Dockerfile
    container_name: admin-backend
    restart: unless-stopped
    # loopback-only: reachable for on-box debugging, never from the internet.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: 8000
    env_file:
      - .env
      - ./backend/admin-api/.env
    volumes:
      - ./backend/admin-api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  panel-backend:
    build:
      context: ./backend/panel-api
      dockerfile: Dockerfile
    container_name: panel-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      PORT: 8001
    env_file:
      - .env
      - ./backend/panel-api/.env
    volumes:
      - ./backend/panel-api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  student-backend:
    build:
      context: ./backend/student-api
      dockerfile: Dockerfile
    container_name: student-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      PORT: 8002
    env_file:
      - .env
      - ./backend/student-api/.env
    volumes:
      - ./backend/student-api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  mentor-backend:
    build:
      context: ./backend/mentor-api
      dockerfile: Dockerfile
    container_name: mentor-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      PORT: 8003
    env_file:
      - .env
      - ./backend/mentor-api/.env
    volumes:
      - ./backend/mentor-api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  # ======================
  # Frontends
  # ======================

  admin-frontend:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-$SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-$SUPABASE_PUBLISHABLE_KEY}
        VITE_PMS_CHAT: ${VITE_PMS_CHAT:-false}
        # No VITE_ADMIN_API_KEY here — see apps/admin/Dockerfile and
        # backend/admin-api/app/panel_sync_proxy.py. ADMIN_API_KEY is passed to
        # admin-backend as a normal (non-VITE, server-only) env var below.
    container_name: admin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - admin-backend

  panel-frontend:
    build:
      context: ./apps/panel
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-$SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-$SUPABASE_PUBLISHABLE_KEY}
        VITE_PMS_CHAT: ${VITE_PMS_CHAT:-false}
    container_name: panel-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - panel-backend

  student-frontend:
    build:
      context: ./apps/student
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-$SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-$SUPABASE_PUBLISHABLE_KEY}
        VITE_PMS_CHAT: ${VITE_PMS_CHAT:-false}
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - student-backend

  mentor-frontend:
    build:
      context: ./apps/mentor
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-$SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-$SUPABASE_PUBLISHABLE_KEY}
        VITE_PMS_CHAT: ${VITE_PMS_CHAT:-false}
    container_name: mentor-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - mentor-backend
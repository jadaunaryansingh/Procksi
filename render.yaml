# Render Blueprint: the four FastAPI services (free plan).
# Frontends are on Vercel; see apps/*/vercel.json and docs/DEPLOYMENT.md.
#
# Secrets are NOT in this file. Before applying the Blueprint, create an
# environment group named `procksi-secrets` in the Render dashboard holding the
# shared values (DATABASE_URL, SUPABASE_*, MAIL_*, TWILIO_*, OPENAI_API_KEY,
# GOOGLE_CLIENT_SECRET, ADMIN_API_KEY, PASSWORD_RESET_SECRET, ALLOWED_EMAIL_DOMAIN,
# MASTER_ADMIN_EMAIL). SECRET_KEY is
# per service and Render asks for each one on first apply (sync: false).
#
# If a service name below is already taken on Render, Render gives it a
# suffixed onrender.com URL. Update the matching vercel.json rewrites and the
# *_INTERNAL/_API_URL values below to the real URL.

envVarGroups:
  - name: procksi-config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STUDENT_PORTAL_URL
        value: https://student.procksi.in
      - key: ADMIN_PORTAL_URL
        value: https://admin.procksi.in
      - key: MENTOR_PORTAL_URL
        value: https://mentor.procksi.in
      - key: PANEL_PORTAL_URL
        value: https://panel.procksi.in
      - key: GOOGLE_CLIENT_ID
        value: 53268196905-gfa2r4klrqrtpgt9r9s4mjhmmgunjlrr.apps.googleusercontent.com
      - key: GOOGLE_REDIRECT_URI
        value: https://admin.procksi.in/auth/google/callback
      - key: GOOGLE_CALENDAR_ID
        value: primary
      # Brevo SMTP relay on 2525: Render free web services block outbound
      # SMTP on ports 25, 465 and 587, so smtp.gmail.com:587 cannot connect.
      # MAIL_USERNAME is the Brevo SMTP login and MAIL_PASSWORD the Brevo SMTP
      # key; both live in the procksi-secrets group, never in this file.
      - key: MAIL_SERVER
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_FROM_NAME
        value: Procksi
      # CORS allowlist: every production frontend origin, comma-separated.
      - key: FRONTEND_URL
        value: https://www.procksi.in,https://procksi.in,https://admin.procksi.in,https://panel.procksi.in,https://student.procksi.in,https://mentor.procksi.in,https://procksi-main.vercel.app,https://procksi-admin.vercel.app,https://procksi-panel.vercel.app,https://procksi-student.vercel.app,https://procksi-mentor.vercel.app

services:
  - type: web
    name: procksi-admin-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/admin-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    # Deploys come only from GitHub Actions (.github/workflows/ci-cd.yml) after
    # the tests pass; Render must not deploy on its own when main changes.
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: procksi-config
      - fromGroup: procksi-secrets
      - key: SECRET_KEY
        sync: false
      # Server-to-server calls that used to go over the docker-compose network.
      - key: PANEL_API_INTERNAL_URL
        value: https://procksi-panel-portal.onrender.com
      - key: PANEL_PORTAL_API_URL
        value: https://procksi-panel-portal.onrender.com
      - key: MENTOR_PORTAL_API_URL
        value: https://procksi-mentor-portal.onrender.com

  - type: web
    name: procksi-panel-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/panel-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: procksi-config
      - fromGroup: procksi-secrets
      - key: SECRET_KEY
        sync: false

  - type: web
    name: procksi-student-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/student-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: procksi-config
      - fromGroup: procksi-secrets
      - key: SECRET_KEY
        sync: false

  - type: web
    name: procksi-mentor-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/mentor-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: procksi-config
      - fromGroup: procksi-secrets
      - key: SECRET_KEY
        sync: false
